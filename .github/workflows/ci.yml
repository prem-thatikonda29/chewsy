# Stage 9 — CI: pytest on every push; only if tests pass (and only on main)
# does the same runner build the Stage 8 image and push it to Docker Hub.
#
# Secrets required in GitHub (repo settings → Secrets → Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  — DVC S3 creds for `dvc pull`
#     (model.joblib is gitignored/DVC-tracked and is BAKED into the image,
#      so a fresh runner must pull before both pytest and docker build)
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN       — docker login + push
# Local push/pull parity: the two AWS_*_CHECKSUM env vars below neutralize
# the botocore trailing-CRC32 that breaks the HuggingFace S3 gateway.
name: ci

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: DVC pull (training data + model.joblib)
        run: dvc pull

      - name: Pytest
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + typecheck + lint + build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

  # PRD 9.1 done-when: a push to `main` → new tagged image on Docker Hub,
  # triggered by Actions (not a manual `docker push` from a laptop).
  # `needs: test` = "only if tests pass". Feature-branch pushes still run
  # pytest + the frontend checks but never touch Docker Hub.
  docker:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: DVC pull (model.joblib is baked into the image)
        run: |
          pip install "dvc[s3]==3.67.1"
          dvc pull

      - name: Docker Hub login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/chewsy:latest" \
                       -t "${{ secrets.DOCKERHUB_USERNAME }}/chewsy:${GITHUB_SHA::7}" .

      - name: Push image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/chewsy:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/chewsy:${GITHUB_SHA::7}"
